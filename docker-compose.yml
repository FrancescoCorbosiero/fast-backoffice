# Development environment: the app, its worker and scheduler, PostgreSQL 18,
# Redis and an S3-compatible store (MinIO). Production images come in phase 8.
#
#   docker compose up -d
#   docker compose exec app composer setup
#   docker compose exec app php artisan owner:create you@example.test
#   open http://localhost:8000/admin

x-app: &app
  build:
    context: .
    dockerfile: docker/dev/Dockerfile
  volumes:
    - .:/var/www/html
  environment:
    DB_HOST: pgsql
    REDIS_HOST: redis
    FILES_DISK: s3
    FILES_S3_KEY: minio
    FILES_S3_SECRET: minio-secret
    FILES_S3_REGION: eu-south-1
    FILES_S3_BUCKET: fast-backoffice
    FILES_S3_ENDPOINT: http://minio:9000
    FILES_S3_USE_PATH_STYLE_ENDPOINT: 'true'
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  app:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - '${APP_PORT:-8000}:8000'

  horizon:
    <<: *app
    command: php artisan horizon

  scheduler:
    <<: *app
    command: php artisan schedule:work

  pgsql:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fast_backoffice
      POSTGRES_USER: fast
      POSTGRES_PASSWORD: fast
    ports:
      - '${DB_PORT_FORWARD:-5432}:5432'
    volumes:
      - pgsql:/var/lib/postgresql/data
      - ./docker/pgsql/create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', 'fast_backoffice', '-U', 'fast']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT_FORWARD:-6379}:6379'
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - '${MINIO_PORT_FORWARD:-9000}:9000'
      - '${MINIO_CONSOLE_PORT_FORWARD:-9001}:9001'
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio minio-secret &&
        mc mb --ignore-existing local/fast-backoffice
      "

volumes:
  pgsql:
  redis:
  minio:
