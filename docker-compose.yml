# Development environment: the app, its worker and scheduler, PostgreSQL 18
# and Redis. Files stay on the local disk (storage/app/private/files); the
# S3-compatible store is only needed in production (docker-compose.prod.yml).
#
#   docker compose up -d            (the first start installs and migrates)
#   docker compose exec app php artisan db:seed
#   docker compose exec app php artisan owner:create you@example.test
#   open http://localhost:8000/admin

x-app: &app
  build:
    context: .
    dockerfile: docker/dev/Dockerfile
  volumes:
    - .:/var/www/html
  environment:
    DB_HOST: pgsql
    REDIS_HOST: redis
    FILES_DISK: local
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    # A fresh checkout has no vendor/ yet: install on first start, then serve.
    # PHP's own server rather than "artisan serve": the latter copies .env into
    # the process and would point the app at 127.0.0.1 instead of the containers.
    command: sh -c "[ -d vendor ] || composer setup; php -S 0.0.0.0:8000 -t public vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    ports:
      - '${APP_PORT:-8000}:8000'

  horizon:
    <<: *app
    command: sh -c "while [ ! -f vendor/autoload.php ]; do sleep 2; done; php artisan horizon"

  scheduler:
    <<: *app
    command: sh -c "while [ ! -f vendor/autoload.php ]; do sleep 2; done; php artisan schedule:work"

  pgsql:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fast_backoffice
      POSTGRES_USER: fast
      POSTGRES_PASSWORD: fast
    ports:
      - '${DB_PORT_FORWARD:-5432}:5432'
    volumes:
      - pgsql:/var/lib/postgresql
      - ./docker/pgsql/create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', 'fast_backoffice', '-U', 'fast']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT_FORWARD:-6379}:6379'
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgsql:
  redis:
