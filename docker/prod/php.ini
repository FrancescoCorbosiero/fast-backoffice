; Production PHP settings on top of php.ini-production.
expose_php = Off
memory_limit = 512M
; A change-request photo is up to 25 MB (pipeline.attachments.max_mb); the
; portal sends every photo of a request in one POST, 90 MB at most in all
; (max_total_mb), under Cloudflare's 100 MB body limit.
upload_max_filesize = 25M
post_max_size = 100M
max_execution_time = 60
date.timezone = Europe/Rome

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.jit = tracing
opcache.jit_buffer_size = 64M

session.cookie_secure = 1
session.cookie_httponly = 1
